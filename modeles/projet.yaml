# =====================================================================
#  Modèle "Projet"  ->  {{Project ...}} pour le wiki XD (wikixd.fabmob.io)
#  Champs et ordre : doc "Modèle Project".
#  Valeurs par défaut : doc "modèle Projet pour Claude".
#  Pour ajouter un autre modèle (Evènement, Acteur, Véhicule) :
#  copier ce fichier, le renommer, et adapter.
# =====================================================================

nom_affiche: "Projet"
modele_wiki: "Project"            # nom écrit après {{ dans la fiche
consigne_generale: >
  Tu rédiges une fiche Projet pour le wiki de l'eXtrême Défi Mobilité (ADEME) /
  Fabrique des Mobilités. Le projet porte en général sur les véhicules intermédiaires
  (vélis). Reste factuel : n'invente rien qui ne soit pas dans le document.
  Les champs à valeurs multiples sont séparés par des virgules.

# source: "ia"      -> rédigé par l'IA à partir du document (laissé vide si absent)
# source: "defaut"  -> valeur fixe (modifiable dans l'interface)
# source: "geo"     -> coordonnées calculées par l'appli à partir du champ indiqué dans lieu_depuis
# source: "vide"    -> toujours laissé vide (à remplir à la main sur le wiki)
# liste_wiki: ...   -> le nom le plus proche dans cette liste du wiki est retenu
#                      (correspondance: stricte -> seulement un nom quasi identique)
#                      (liste dans donnees_wiki/Categorie_<nom>.txt)
champs:
  - nom: Lang
    source: defaut
    valeur: "Français"

  - nom: shortDescription
    source: ia
    consigne: "Résumé du projet en 2 lignes maximum (environ 200 caractères)."

  - nom: Main_Picture
    source: vide      # nom d'un fichier image déjà téléversé sur le wiki

  - nom: description
    source: ia
    redaction_separee: true     # rédigée seule, en texte libre, pour être plus détaillée
    consigne: >
      Rédige la description complète du projet en wikitexte MediaWiki
      (titres de section avec == Titre ==, listes à puces avec *, gras avec '''texte''').

      NE RÉSUME PAS : reprends un maximum d'informations du document, avec ses chiffres,
      dates, lieux, durées, budgets, publics, méthodes, résultats et retours d'expérience.
      Développe chaque point présent dans le document. La description doit être longue
      si le document est riche. Reformule en phrases claires, mais garde tous les détails.

      N'INVENTE RIEN : chaque information doit venir du document. Si une rubrique n'est
      pas renseignée dans le document, ne crée pas la section.

      NE METS PAS dans la description ce qui a déjà son propre champ dans la fiche :
      la liste des véhicules utilisés ou testés, la liste des partenaires / acteurs,
      les suites envisagées et l'étape d'avancement, les besoins du projet, le lieu.

      Sections possibles (seulement si le document les renseigne) : Contexte, Objectifs,
      Déroulement / organisation, Publics et usages, Résultats et chiffres clés,
      Enseignements.
    entoure_par: ["<div><div>\n", "\n</div></div>"]

  - nom: "Coordonnées géo"
    source: geo
    lieu_depuis: location
    format: "{lat},{lon}"       # aucun espace ; pour inverser l'ordre : "{lon},{lat}"

  - nom: location
    source: ia
    consigne: >
      Lieu principal du projet : commune, et département si connu, tel qu'écrit
      dans le document. Exemple : "Saint-Flour, Cantal".

  - nom: url
    source: ia
    consigne: "Site web officiel du projet s'il figure dans le document (une seule adresse)."

  - nom: Tags
    source: defaut
    valeur: "deploiement2026"

  - nom: Theme
    source: defaut
    valeur: "Véhicules intermédiaires, eXtrême Défi"

  - nom: from
    source: ia
    liste_wiki: "Acteur"
    consigne: >
      Acteurs porteurs ou partenaires du projet (structures juridiques : collectivité,
      entreprise, association...). Pour chacun, prends dans la liste « Acteur » du wiki
      le nom le plus proche de celui du document, copié à l'identique.

  - nom: to
    source: ia
    liste_wiki: "Acteur"
    consigne: >
      Structures bénéficiaires ou destinataires du projet (ex. collectivité qui accueille
      l'expérimentation), si distinctes des porteurs. Pour chacune, prends dans la liste
      « Acteur » du wiki le nom le plus proche, copié à l'identique.

  - nom: vehicule_equipe
    source: ia
    liste_wiki: "Vehicule"
    consigne: >
      Véhicules mentionnés dans le document. Pour chacun, prends dans la liste
      « Vehicule » du wiki le nom le plus proche de celui du document, copié à l'identique.

  - nom: contributeurs
    source: ia
    liste_wiki: "Utilisateur"
    correspondance: stricte     # une personne : pas de rapprochement approximatif
    consigne: >
      Personnes nommées dans le document comme contributrices du projet, seulement si
      elles figurent dans la liste « Utilisateur » du wiki (nom copié à l'identique).

  - nom: referent
    source: defaut
    valeur: "Johana Casallas"

  - nom: challenge
    source: defaut
    valeur: "L'extrême défi ADEME"

  - nom: othercommon
    source: ia
    consigne: "Communs (ressources ouvertes) utilisés par le projet, seulement s'ils sont cités."

  - nom: othercommon2
    source: vide

  - nom: "communauté d'intérêt"
    source: defaut
    valeur: "Communauté de l'extrême défi, GT Territoires et Expérimentations XD"

  - nom: keyuser
    source: ia
    consigne: "Utilisateurs clés du projet (structures ou publics cibles), seulement s'ils sont cités."

  - nom: Develop
    source: vide

  - nom: type
    source: vide

  - nom: forum
    source: defaut
    valeur: "https://forum.fabmob.io/t/experimentations-et-deploiement-2026-2027/2327"

  - nom: chat
    source: ia
    consigne: "Lien vers un espace de discussion du projet, seulement s'il figure dans le document."

  - nom: tasks
    source: vide

  - nom: filessharing
    source: ia
    consigne: "Lien vers un espace de partage de fichiers du projet, seulement s'il figure dans le document."

  - nom: needs
    source: ia
    consigne: "Besoins du projet (financement, partenaires, compétences, véhicules...), en liste à puces wikitexte avec *."

  - nom: complement
    source: ia
    consigne: "Informations complémentaires utiles qui ne rentrent pas dans la description."

  - nom: etape
    source: ia
    consigne: >
      Étape d'avancement du projet (idée, préparation, expérimentation en cours, terminé...),
      dates clés, et suites envisagées. Liste à puces wikitexte avec * si plusieurs éléments.
